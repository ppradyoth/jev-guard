[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-guard"
version = "0.2.0"
description = "Static auditor for code that uses Jev / TypeSafe System One models as a security guardrail."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Pradyoth P." }]
keywords = ["ai-security", "jev", "typesafe", "guardrail", "llm", "red-team", "static-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
]
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/ppradyoth/jev-guard"
Issues = "https://github.com/ppradyoth/jev-guard/issues"

[project.scripts]
jev-guard = "jev_guard.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/jev_guard"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
